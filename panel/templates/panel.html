<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>xttp panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/panel.css">
<script type="module" src="/static/app.js"></script>
</head>
<body data-version="@@VERSION@@">
<div class="bg-fx" aria-hidden="true"><div class="mesh"></div><div class="grid"></div><div class="vignette"></div></div>
<a class="skip-link" href="#main">К содержимому</a>
<div class="app">
<header class="topbar">
<a class="brand" href="/rules"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>xttp panel</a>
<div class="top-right">
<a href="/system/updates" class="chip ver-chip" data-settings title="Версии и обновления">v@@VERSION@@</a>
<span id="service-status" class="chip chip-status">Сервисы · …</span>
<span id="connection-chip" class="chip chip-status">xttp · …</span>
<a href="/system/core" class="chip chip-action" data-settings><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m9 3 1-1h4l1 3 3 1 3 3-1 3 1 3-3 3-3 1-1 3h-4l-1-3-3-1-3-3 1-3-1-3 3-3 3-1Z"/></svg>Настройки</a>
<button type="button" id="logout" class="link-logout">Выйти</button>
</div>
</header>
<div class="shell-toolbar">
<div id="global-search-slot"></div>
<nav class="primary-nav stabs" aria-label="Разделы панели">
<a href="/rules" data-section="rules">Правила</a>
<a href="/monitoring/traffic" data-section="traffic">Статистика</a>
<a href="/monitoring/connections" data-section="connections">Соединения</a>
<a href="/monitoring/logs" data-section="logs">Логи</a>
</nav>
<div id="rule-actions-slot" class="toolbar-right"></div>
</div>
<div class="workspace">
<header class="page-header"><div><h1 id="page-title">Настройки</h1><p id="page-description" class="muted"></p></div><a href="/rules" class="modal-x" data-close-settings aria-label="Закрыть настройки"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></a></header>
<nav id="section-nav" class="section-nav stabs" aria-label="Разделы настроек" hidden></nav>
<div class="workspace-body">
<aside id="update-offer" class="notice" hidden></aside>
<aside id="bundle-notice" class="notice" role="status" hidden></aside>
<main id="main" tabindex="-1"><p class="loading" role="status">Загрузка…</p></main>
</div>
</div>
<footer class="panel-footer"><span>@@USERNAME@@</span><span>xttp panel · v@@VERSION@@</span></footer>
</div>
<div id="notifications" class="notifications" aria-live="polite" aria-atomic="false"></div>
<dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title"><div class="settings-shell"><header class="page-header"><h2 id="settings-title">Настройки</h2><a href="/rules" class="modal-x" data-close-settings aria-label="Закрыть настройки"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></a></header><nav id="settings-nav" class="section-nav stabs" aria-label="Разделы настроек"></nav><div class="workspace-body"><p id="settings-busy" class="status warning" hidden></p><div id="settings-content"></div></div></div></dialog>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"><form method="dialog"><h2 id="confirm-title">Подтверждение</h2><p id="confirm-message"></p><div class="actions"><button value="cancel" autofocus>Отмена</button><button value="confirm" id="confirm-action" class="primary">Подтвердить</button></div></form></dialog>
<noscript><p class="notice">Для панели нужен JavaScript. Включите его и обновите страницу.</p></noscript>
</body>
</html>
