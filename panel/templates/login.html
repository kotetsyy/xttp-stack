<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>xttp panel — Вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/panel.css">
</head>
<body class="login-page">
<div class="bg-fx" aria-hidden="true"><div class="mesh"></div><div class="grid"></div><div class="vignette"></div></div>
<main class="login-panel">
<div class="login-logo"><span class="login-mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span class="brand">xttp panel</span></div>
<h1>Добро пожаловать</h1>
<p class="muted">Войдите, чтобы управлять группами маршрутизации</p>
<p class="login-message" role="status">@@CONTENT@@</p>
<form action="/login" method="post" class="form-stack">
<label for="username">Имя пользователя</label>
<input id="username" name="user" autocomplete="username" placeholder="Имя пользователя" required autofocus>
<label for="password">Пароль</label>
<input id="password" name="pass" type="password" autocomplete="current-password" placeholder="Пароль" required>
<button type="submit" class="primary">Войти</button>
</form>
<p class="login-foot">version @@VERSION@@</p>
</main>
</body>
</html>
